plugins {
    id 'java'
    id 'war'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'org.springframework:spring-core:7.0.3'
    implementation 'org.springframework:spring-context:7.0.3'
    implementation 'org.springframework:spring-beans:7.0.3'
    implementation 'org.springframework:spring-web:7.0.3'
    implementation 'org.springframework:spring-webmvc:7.0.3'
    implementation 'org.springframework:spring-jdbc:7.0.3'
    implementation 'org.thymeleaf:thymeleaf-spring6:3.1.3.RELEASE'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    implementation 'org.postgresql:postgresql:42.7.9'
    implementation 'org.hibernate.validator:hibernate-validator:9.1.0.Final'
    implementation 'org.hibernate.orm:hibernate-core:7.2.1.Final'
    implementation 'org.springframework:spring-orm:7.0.3'
    implementation 'org.springframework.data:spring-data-jpa:4.0.2'
}

test {
    useJUnitPlatform()
}