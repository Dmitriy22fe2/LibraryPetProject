<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Читатель</title>
</head>
<body>
  <p th:text="${person.getFullName() + ', ' + person.getBirthYear()}">Reader</p>
  <p th:if="${books.isEmpty()}" th:text="@{Человек пок не взял ни одной книги}"></p>
  <hr/>
  <p th:if="${!books.isEmpty()}">Книги: </p>
  <div th:each="book : ${books}">
    <p th:text="${book.getName() + ', ' + book.getAuthor() + ', ' + book.getYear()}">Book</p>
  </div>
  <hr th:if="${!books.isEmpty()}"/>
  <form th:method="GET" th:action="@{/people/{id}/edit(id=${person.getPersonid()})}">
      <input type="submit" value="Редактировать">
  </form>
  <form th:method="DELETE" th:action="@{/people/{id}(id=${person.getPersonid()})}">
      <input type="submit" value="Удалить">
  </form>
  <br/>
  <a href="/">На главную</a>
</body>
</html>
