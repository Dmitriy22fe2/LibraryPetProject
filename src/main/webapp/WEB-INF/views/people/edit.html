<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Редактировать</title>
</head>
<body>
  <form th:method="PATCH" th:action="@{/people/{id}(id=${person.getPersonid()})}" th:object="${person}">
    <label for="name">Введите ФИО: </label>
    <input type="text" th:field="*{fullName}" id="name">
    <div style="color:red" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Name errors</div>
    <br/>
    <label for="age">Введите год рождения: </label>
    <input type="text" th:field="*{birthYear}" id="age">
    <div style="color:red" th:if="${#fields.hasErrors('birthYear')}" th:errors="*{birthYear}">BirthYear errors</div>
    <br/>
    <input type="submit", value="Редактировать">
  </form>
  <br/>
  <a href="/">На главную</a>
</body>
</html>
