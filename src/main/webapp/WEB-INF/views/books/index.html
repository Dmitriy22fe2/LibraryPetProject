<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Книги</title>
</head>
<body>
    <div th:each="book : ${books}">
        <a th:text="${book.getName() + ', ' + book.getAuthor() + ', ' + book.getYear()}"
           th:href="@{/books/{id}(id=${book.getBookid()})}">Book</a>
    </div>
    <hr/>
    <a href="/books/new">Добавить книгу</a>
    <br/>
    <a href="/">На главную</a>
</body>
</html>
